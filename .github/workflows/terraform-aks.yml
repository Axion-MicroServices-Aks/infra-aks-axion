# To test if aks is working with OIDC
name: AKS Terraform CI-CD
# Workflow can start in two different situations. First, when a pull request is opened against main, and second, when code is actually pushed into main.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Infra_aks/**'

  push:
    branches:
      - main
    paths:
      - 'Infra_aks/**'
permissions:
  contents: read
  id-token: write
env:
  TF_VERSION: '1.16.2'
  TF_WORKING_DIR: './Infra_aks'

  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

# ============================================================
# STAGE 1 - PR VALIDATION
# ============================================================

jobs:
  validate:
    name: Terraform Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------
      # Install Terraform
      # --------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------
      # Terraform Format
      # --------------------------
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      # --------------------------
      # Azure OIDC Login
      # --------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange  # Required for "Other Issuer" wildcard setups

      # --------------------------
      # Terraform Init
      # --------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=terraformBackend-rg" \
            -backend-config="storage_account_name=terraforms23tatplatform" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aks.tfstate" \
            -backend-config="use_oidc=true"

      # --------------------------
      # Terraform Validate
      # --------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # --------------------------
      # Checkov
      # --------------------------
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Infra_aks
          framework: terraform

      # --------------------------
      # Terraform Plan
      # --------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan
        
